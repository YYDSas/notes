<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的笔记</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --text:#2c2c2a; --muted:#6b6b66;
  --border:#e5e4e0; --accent:#1a6b5a; --accent-soft:#eaf5f1;
  --code-bg:#f2f1ed; --sidebar-w:280px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.75; font-size:16px;
}
.layout{display:flex;min-height:100vh;}

/* ---------- 侧边栏 ---------- */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--card);
  border-right:1px solid var(--border); height:100vh; position:sticky; top:0;
  display:flex; flex-direction:column;
}
.sidebar-head{padding:20px 20px 12px;}
.site-title{font-size:17px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
.site-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.search-box{padding:0 16px 14px;}
.search-box input{
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.nav{flex:1;overflow-y:auto;padding:0 12px 24px;}
.nav::-webkit-scrollbar{width:6px;}
.nav::-webkit-scrollbar-thumb{background:#dcdbd6;border-radius:3px;}
.nav-group{margin-bottom:6px;}
.nav-cat{
  font-size:12px;font-weight:600;color:var(--muted);padding:12px 8px 6px;
  letter-spacing:.6px;text-transform:uppercase;user-select:none;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
}
.nav-cat .arrow{font-size:10px;transition:transform .2s;color:#b5b4ae;}
.nav-cat.collapsed .arrow{transform:rotate(-90deg);}
.nav-list{overflow:hidden;transition:max-height .25s ease;}
.nav-list.hidden{max-height:0!important;}
.nav-item{
  display:block;padding:8px 10px;border-radius:7px;color:var(--text);
  text-decoration:none;font-size:14px;cursor:pointer;transition:background .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500;}
.nav-item mark{background:#ffe9a8;color:inherit;border-radius:2px;}

/* ---------- 正文 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--card);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
}
.menu-btn{
  width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer;
}
.menu-btn span{display:block;width:16px;height:1.5px;background:var(--text);border-radius:1px;}
.topbar-title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.content{max-width:780px;width:100%;margin:0 auto;padding:44px 40px 120px;}
.content h1{font-size:30px;font-weight:600;line-height:1.35;margin-bottom:10px;letter-spacing:-.3px;}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:20px;font-size:12px;}
.content h2{font-size:21px;font-weight:600;margin:38px 0 14px;padding-left:12px;border-left:3px solid var(--accent);line-height:1.4;}
.content h3{font-size:17px;font-weight:600;margin:26px 0 10px;}
.content h4{font-size:15px;font-weight:600;margin:20px 0 8px;color:var(--muted);}
.content p{margin:12px 0;}
.content ul,.content ol{margin:12px 0 12px 22px;}
.content li{margin:6px 0;}
.content blockquote{
  background:#fdf8ec;border-left:3px solid #e0b64a;border-radius:0 8px 8px 0;
  padding:12px 16px;margin:14px 0;color:#4a4535;
}
.content blockquote p{margin:0;}
.content code{
  background:var(--code-bg);padding:2px 6px;border-radius:4px;
  font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13.5px;color:#b3453a;
}
.content pre{background:#2b2b28;color:#eaeae5;padding:16px 18px;border-radius:10px;overflow-x:auto;margin:16px 0;}
.content pre code{background:none;color:inherit;padding:0;font-size:13px;line-height:1.6;}
.content table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14.5px;display:block;overflow-x:auto;}
.content th,.content td{border:1px solid var(--border);padding:9px 12px;text-align:left;}
.content th{background:var(--bg);font-weight:600;}
.content tr:nth-child(even) td{background:#fbfbf9;}
.content hr{border:none;border-top:1px solid var(--border);margin:32px 0;}
.content a{color:var(--accent);text-decoration:none;border-bottom:1px solid #b8d9d0;}
.content a:hover{border-bottom-color:var(--accent);}
.content img{max-width:100%;border-radius:10px;margin:16px 0;}
.content strong{font-weight:600;}

.loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:14px;}
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.35;}
.notfound{text-align:center;padding:70px 20px;color:var(--muted);}

.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29;}
.backdrop.show{display:block;}

/* ---------- 移动端 ---------- */
@media(max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);
    transition:transform .26s ease;box-shadow:0 0 30px rgba(0,0,0,.12);
  }
  .sidebar.open{transform:translateX(0);}
  .topbar{display:flex;}
  .content{padding:26px 20px 100px;}
  .content h1{font-size:24px;}
  .content h2{font-size:19px;margin-top:30px;}
  body{font-size:15.5px;}
}
@media print{
  .sidebar,.topbar{display:none;}
  .content{max-width:none;padding:0;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="site-title"><span class="dot"></span><span id="siteName">我的笔记</span></div>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="搜索笔记内容…" autocomplete="off">
    </div>
    <nav class="nav" id="nav"><div class="loading">加载中…</div></nav>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <div class="menu-btn" id="menuBtn"><span></span><span></span><span></span></div>
      <div class="topbar-title" id="topbarTitle">我的笔记</div>
    </div>
    <article class="content" id="content"><div class="loading">正在载入笔记…</div></article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
/* ============================================================
   笔记索引：新增笔记后，只需在这里加一行
   格式： { file: 'notes/分类/文件名.md', title: '标题', cat: '分类', tags: ['标签'], date: '2026-10-02' }
   ============================================================ */
const NOTES = [
  { file:'notes/SystemVerilog/类与对象基础.md',      title:'SV · 类与对象基础',      cat:'SystemVerilog', tags:['类','对象','句柄','内存'], date:'2026-10-02', order:1 },
  { file:'notes/SystemVerilog/封装-local-protected.md', title:'SV · 封装 local / protected', cat:'SystemVerilog', tags:['封装','local','protected'], date:'2026-10-02', order:2 },
  { file:'notes/SystemVerilog/继承与virtual方法.md', title:'SV · 继承与 virtual 方法', cat:'SystemVerilog', tags:['继承','virtual','clone','cast'], date:'2026-10-02', order:3 },
  { file:'notes/英语六级/听力-满分技巧.md',  title:'六级听力 · 满分技巧',  cat:'英语六级', tags:['听力','技巧'],  date:'2026-10-02' },
  { file:'notes/英语六级/阅读-长难句拆解.md', title:'六级阅读 · 长难句拆解', cat:'英语六级', tags:['阅读','语法'],  date:'2026-10-02' },
  { file:'notes/考研政治/马原核心考点.md',   title:'考研政治 · 马原核心考点', cat:'考研政治', tags:['马原','哲学'],  date:'2026-10-02' }
];

const SITE_NAME = '我的笔记';

/* ---------------- Markdown 配置 ---------------- */
marked.setOptions({ breaks:true, gfm:true });

/* ---------------- 工具函数 ---------------- */
function stripFrontMatter(text){
  if(text.startsWith('---')){
    const end = text.indexOf('\n---', 3);
    if(end !== -1) return text.slice(text.indexOf('\n', end+1)+1).trim();
  }
  return text.trim();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- 状态 ---------------- */
const cache = {};                       // 文件内容缓存
let currentFile = null;
const contentEl = document.getElementById('content');
const navEl = document.getElementById('nav');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
document.getElementById('siteName').textContent = SITE_NAME;
document.title = SITE_NAME;

/* ---------------- 侧边栏渲染 ---------------- */
function groupByCategory(list){
  const map = {};
  list.forEach(n => { (map[n.cat] = map[n.cat] || []).push(n); });
  return map;
}
function renderNav(filter){
  const kw = (filter || '').trim().toLowerCase();
  const list = kw
    ? NOTES.filter(n => (n.title + ' ' + n.cat + ' ' + (n.tags||[]).join(' ')).toLowerCase().includes(kw))
    : NOTES;

  if(!list.length){
    navEl.innerHTML = '<div style="padding:20px 8px;color:#888;font-size:13px;">没有匹配的笔记</div>';
    return;
  }

  const groups = groupByCategory(list);
  let html = '';
  Object.keys(groups).sort().forEach(cat => {
    const items = groups[cat].slice().sort((a,b) => (a.order||99)-(b.order||99) || a.title.localeCompare(b.title,'zh'));
    const catId = 'cat-' + encodeURIComponent(cat).replace(/%/g,'');
    html += '<div class="nav-group">';
    html += '<div class="nav-cat" data-target="'+catId+'"><span>'+escapeHtml(cat)+' <span style="font-weight:400;opacity:.65;">'+items.length+'</span></span><span class="arrow">▼</span></div>';
    html += '<div class="nav-list" id="'+catId+'">';
    items.forEach(n => {
      let label = escapeHtml(n.title);
      if(kw) label = label.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>');
      const active = n.file === currentFile ? ' active' : '';
      html += '<a class="nav-item'+active+'" data-file="'+escapeHtml(n.file)+'">'+label+'</a>';
    });
    html += '</div></div>';
  });
  navEl.innerHTML = html;

  navEl.querySelectorAll('.nav-item').forEach(a => {
    a.addEventListener('click', () => { location.hash = '#' + encodeURIComponent(a.dataset.file); closeSidebar(); });
  });
  navEl.querySelectorAll('.nav-cat').forEach(h => {
    h.addEventListener('click', () => {
      h.classList.toggle('collapsed');
      document.getElementById(h.dataset.target).classList.toggle('hidden');
    });
  });
}

/* ---------------- 正文渲染 ---------------- */
async function loadNote(file){
  const meta = NOTES.find(n => n.file === file);
  if(!meta){
    contentEl.innerHTML = '<div class="notfound"><h2>找不到这篇笔记</h2><p style="margin-top:10px;">请检查笔记索引中的路径是否正确。</p></div>';
    return;
  }
  currentFile = file;
  document.getElementById('topbarTitle').textContent = meta.title;
  document.title = meta.title + ' · ' + SITE_NAME;
  renderNav(document.getElementById('searchInput').value);

  contentEl.innerHTML = '<div class="loading">正在载入…</div>';
  try{
    let raw = cache[file];
    if(raw === undefined){
      const res = await fetch(file);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      raw = await res.text();
      cache[file] = raw;
    }
    const body = stripFrontMatter(raw);
    let html = marked.parse(body);

    const tags = (meta.tags||[]).map(t => '<span class="tag">'+escapeHtml(t)+'</span>').join('');
    const head = '<h1>'+escapeHtml(meta.title)+'</h1>'
      + '<div class="meta"><span>'+escapeHtml(meta.cat)+'</span>'
      + (meta.date ? '<span>·</span><span>'+escapeHtml(meta.date)+'</span>' : '')
      + (tags ? '<span>·</span>'+tags : '')
      + '</div>';
    contentEl.innerHTML = head + html;
    window.scrollTo({top:0,behavior:'instant'});
  }catch(err){
    contentEl.innerHTML = '<div class="notfound"><h2>加载失败</h2>'
      + '<p style="margin-top:10px;">'+escapeHtml(err.message)+'</p>'
      + '<p style="margin-top:14px;font-size:13px;line-height:1.9;">'
      + '常见原因：<br>'
      + '1. 直接双击打开本地文件（file:// 协议）——请用本地服务器预览<br>'
      + '2. 笔记文件路径或文件名与实际不一致<br>'
      + '3. 网络无法访问 CDN</p></div>';
  }
}

/* ---------------- 全文搜索 ---------------- */
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', e => {
  const kw = e.target.value;
  renderNav(kw);
  clearTimeout(searchTimer);
  if(!kw.trim() || kw.trim().length < 2) return;
  searchTimer = setTimeout(async () => {
    const needle = kw.trim().toLowerCase();
    const hits = [];
    for(const n of NOTES){
      let raw = cache[n.file];
      if(raw === undefined){
        try{ const r = await fetch(n.file); if(!r.ok) continue; raw = await r.text(); cache[n.file] = raw; }catch(_){ continue; }
      }
      const text = stripFrontMatter(raw);
      const idx = text.toLowerCase().indexOf(needle);
      if(idx !== -1){
        hits.push({ note:n, snippet: text.slice(Math.max(0,idx-40), idx+90).replace(/\n/g,' ') });
      }
    }
    if(hits.length){
      const cur = document.getElementById('searchInput').value.trim().toLowerCase();
      if(cur !== needle) return;
      let h = '<h3 style="margin:30px 0 14px;font-size:15px;color:#6b6b66;">全文命中 '+hits.length+' 处</h3>';
      hits.forEach(x => {
        h += '<div style="border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fff;cursor:pointer;" '
           + 'onclick="location.hash=\'#'+encodeURIComponent(x.note.file)+'\'">'
           + '<div style="font-weight:600;font-size:15px;">'+escapeHtml(x.note.title)+'</div>'
           + '<div style="font-size:13.5px;color:#6b6b66;margin-top:6px;">…'+escapeHtml(x.snippet)+'…</div></div>';
      });
      contentEl.insertAdjacentHTML('beforeend', h);
    }
  }, 300);
});

/* ---------------- 移动端侧边栏 ---------------- */
function openSidebar(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click', openSidebar);
backdrop.addEventListener('click', closeSidebar);

/* ---------------- 路由 ---------------- */
function route(){
  const hash = decodeURIComponent(location.hash.slice(1));
  loadNote(hash || (NOTES[0] && NOTES[0].file));
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
