<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>自测复习 · 我的笔记</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --text:#2c2c2a; --muted:#6b6b66;
  --border:#e5e4e0; --accent:#1a6b5a; --accent-soft:#eaf5f1;
  --warn:#a8621b; --warn-soft:#fdf3e6; --ok:#1a6b5a; --ok-soft:#eaf5f1;
  --code-bg:#f2f1ed;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.75; font-size:16px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px;}

/* ---------- 顶栏 ---------- */
.top{padding:22px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.top h1{font-size:19px;font-weight:600;letter-spacing:.3px;}
.top h1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;}
.top .spacer{flex:1;}
.top a.back{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--border);
  background:var(--card);padding:6px 12px;border-radius:8px;white-space:nowrap;}
.top a.back:hover{border-color:var(--accent);}

/* ---------- 标签页 ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab{flex-shrink:0;padding:9px 15px;font-size:14.5px;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;user-select:none;background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab .n{font-size:12px;opacity:.7;}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 22px 18px;margin-bottom:16px;}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;}
.badge{background:var(--bg);border:1px solid var(--border);padding:2px 9px;border-radius:999px;font-size:12px;}
.badge.new{background:var(--warn-soft);border-color:#f0dcc2;color:var(--warn);}
.badge.ok{background:var(--ok-soft);border-color:#cfe7df;color:var(--ok);}
.q{font-size:16.5px;white-space:pre-wrap;word-break:break-word;line-height:1.85;}
.q code,.a code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.92em;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
.a{margin-top:16px;padding:16px 16px 14px;background:var(--accent-soft);border-radius:10px;
  white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.85;}
.a::before{content:"答案要点";display:block;font-size:12px;color:var(--accent);letter-spacing:.5px;margin-bottom:8px;font-weight:600;}

/* ---------- 按钮 ---------- */
.btn{display:inline-block;font-family:inherit;font-size:15px;padding:10px 20px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);background:var(--card);color:var(--text);transition:border-color .15s,background .15s;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{opacity:.9;}
.btn.grid{background:var(--ok-soft);border-color:#cfe7df;color:var(--ok);}
.btn.fail{background:var(--warn-soft);border-color:#f0dcc2;color:var(--warn);}
.btn.sm{font-size:13.5px;padding:7px 14px;border-radius:8px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;}
.row.between{justify-content:space-between;}
.hint{font-size:13px;color:var(--muted);}
.center{text-align:center;}

/* ---------- 抽题的分区过滤 ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip{font-size:13.5px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;user-select:none;font-family:inherit;color:var(--muted);}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}

/* ---------- 全部题目 ---------- */
.group{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.group>h3{font-size:14.5px;font-weight:600;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;
  background:var(--card);user-select:none;}
.group>h3:hover{background:var(--bg);}
.group>h3 .k{flex:1;min-width:0;}
.group>h3 .c{font-size:12px;color:var(--muted);font-weight:400;}
.item{border-top:1px solid var(--border);padding:12px 16px;font-size:14.5px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.item:hover{background:var(--bg);}
.item .ii{flex:1;min-width:0;}
.item .body{display:none;margin-top:10px;white-space:pre-wrap;font-size:14.5px;line-height:1.8;
  background:var(--accent-soft);border-radius:8px;padding:12px 14px;}
.item.open .body{display:block;}
.item .txt{white-space:pre-wrap;}
.item .go{font-size:12px;color:var(--accent);text-decoration:none;margin-top:8px;display:inline-block;}
.dotb{width:7px;height:7px;border-radius:50%;background:#d9d8d3;flex-shrink:0;margin-top:8px;}
.dotb.new{background:#e0a458;}
.dotb.due{background:#d9534f;}
.dotb.ok{background:var(--accent);}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;}
.stat .v{font-size:24px;font-weight:600;line-height:1.3;}
.stat .l{font-size:12.5px;color:var(--muted);}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin:6px 0 4px;}
.bar>i{display:block;height:100%;background:var(--accent);}
.blk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 18px 14px;margin-bottom:14px;}
.blk h3{font-size:14.5px;font-weight:600;margin-bottom:12px;}
.line{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;}
.line .nm{width:96px;flex-shrink:0;color:var(--muted);font-size:13.5px;}
.line .bd{flex:1;}
.line .pc{width:74px;text-align:right;flex-shrink:0;font-size:13.5px;color:var(--muted);}

.done-note{background:var(--accent-soft);border-radius:12px;padding:20px;text-align:center;color:var(--accent);}
.empty{color:var(--muted);font-size:14.5px;padding:24px 0;text-align:center;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

@media (max-width:640px){
  body{font-size:15.5px;}
  .wrap{padding:0 12px 50px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .card{padding:18px 16px 14px;border-radius:12px;}
  .q{font-size:16px;}
  .btn{padding:11px 18px;}
  .row.gap .btn{flex:1;text-align:center;}
  .line .nm{width:74px;font-size:12.5px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1><span class="dot"></span>自测复习</h1>
    <div class="spacer"></div>
    <a class="back" href="index.html">← 回到笔记</a>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</div>

<script src="quiz-questions.js"></script>
<script>
/* ============================================================
   自测复习 · 排期规则
   每个 box 对应一个复习间隔：box 0 = 今天再来，1 = 明天，3 = 3 天后，7 = 7 天后，21 = 21 天后
   自评「想起来了」→ box + 1（最高 4），下次到期 = 今天 + 间隔
   自评「没想起来」→ box - 1（最低 0），下次到期 = 今天 + 间隔（box 0 表示今天还要再来一遍）
   数据只存在你自己的浏览器里（localStorage），换设备不同步。
   ============================================================ */
const KEY = 'notesQuizV1';
const DAYS = [0, 1, 3, 7, 21];
const BOX_LABEL = ['新题', '隔天', '3 天后', '7 天后', '已掌握'];

function dstr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function today(){ return dstr(new Date()); }
function soon(n){ const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); }

function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY));
    if(o && o.v === 1 && o.s) return o;
  }catch(e){}
  return { v:1, s:{} };
}
let DB = load();
function save(){ DB.t = (window.QUIZ_QUESTIONS || []).length; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

function st(id){ return DB.s[id] || null; }
function box(id){ const s = st(id); return s ? s.b : 0; }
function isDue(id){ const s = st(id); return !s || s.d <= today(); }
function isNew(id){ return !st(id); }

function rate(id, good){
  const cur = st(id) || { b:0, ok:0, ng:0, d:today(), l:null };
  if(good){
    cur.ok = (cur.ok||0) + 1;
    cur.b = Math.min(cur.b + 1, 4);
  }else{
    cur.ng = (cur.ng||0) + 1;
    cur.b = Math.max(cur.b - 1, 0);
  }
  cur.l = today();
  cur.d = soon(DAYS[cur.b]);
  DB.s[id] = cur;
  save();
}

const Q = (window.QUIZ_QUESTIONS || []).slice();
const CATS = [...new Set(Q.map(x => x.cat))];
const byId = {};
Q.forEach(x => byId[x.id] = x);
// 记录题库总数，供首页侧边栏算"今日待复习"
DB.t = Q.length;
save();

/* ---------------- 视图状态 ---------------- */
let view = 'review';
let queue = [];          // 本轮待复习的 id 列表
let rndCat = '全部';
let curQ = null;         // 当前展示的题
let revealed = false;
let sessionOk = 0, sessionNg = 0;

const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');

function dueList(){ return Q.filter(x => isDue(x.id)).map(x => x.id); }
function counts(){
  const due = dueList().length;
  const mastered = Q.filter(x => box(x.id) === 4).length;
  const seen = Q.filter(x => !!st(x.id)).length;
  return { due, mastered, seen, total: Q.length };
}

/* ---------------- 标签页 ---------------- */
function renderTabs(){
  const c = counts();
  const items = [
    ['review', '今日复习', c.due],
    ['random', '抽题练习', 0],
    ['all',    '全部题目', Q.length],
    ['stats',  '进度统计', 0],
  ];
  tabsEl.innerHTML = items.map(([k, label, n]) =>
    '<button class="tab' + (view===k?' on':'') + '" data-v="' + k + '">' + label +
    (n ? ' <span class="n">' + n + '</span>' : '') + '</button>'
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    view = b.dataset.v;
    if(view === 'review'){ queue = dueList(); curQ = null; revealed = false; }
    if(view === 'random'){ curQ = null; revealed = false; }
    render();
  });
}

/* ---------------- 通用：题卡 ---------------- */
function cardHTML(q, opts){
  const b = box(q.id);
  const badge = isNew(q.id)
    ? '<span class="badge new">新题</span>'
    : (b === 4 ? '<span class="badge ok">已掌握</span>' : '<span class="badge">' + BOX_LABEL[b] + '</span>');
  let h = '<div class="card">';
  h += '<div class="meta"><span class="badge">' + esc(q.cat) + '</span>' + badge +
       '<span>' + esc(q.title) + '</span>' +
       '<span class="spacer" style="flex:1"></span>' +
       '<a class="go" style="margin:0" href="index.html#' + esc(q.note) + '">看原文 →</a></div>';
  h += '<div class="q">' + esc(q.q) + '</div>';
  if(!revealed){
    h += '<div class="row"><button class="btn primary" id="rev">显示答案</button>' +
         (opts && opts.hint ? '<span class="hint">' + opts.hint + '</span>' : '') + '</div>';
  }else{
    h += '<div class="a">' + esc(q.a) + '</div>';
    h += '<div class="row gap">' +
         '<button class="btn fail" id="ng">没想起来</button>' +
         '<button class="btn grid" id="ok">想起来了</button>' +
         '<span class="hint">自评会排进复习计划（快捷键 1 / 2）</span></div>';
  }
  h += '</div>';
  return h;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function bindCard(onRate){
  const r = document.getElementById('rev');
  if(r) r.onclick = () => { revealed = true; render(); };
  const ok = document.getElementById('ok');
  const ng = document.getElementById('ng');
  if(ok) ok.onclick = () => onRate(true);
  if(ng) ng.onclick = () => onRate(false);
}

/* ---------------- 视图：今日复习 ---------------- */
function viewReview(){
  if(!queue.length) queue = dueList();
  if(!queue.length){
    const c = counts();
    let h = '<div class="done-note"><div style="font-size:17px;font-weight:600;margin-bottom:6px;">今天的复习完成了</div>' +
      '<div style="font-size:14px;">共 ' + c.total + ' 题，已掌握 ' + c.mastered + ' 题、还有 ' + c.seen + ' 题在排期里。<br>' +
      '下一批到期时间见「进度统计」。</div></div>';
    h += '<div class="row"><button class="btn" id="again">全量重来一轮</button>' +
         '<span class="hint">不改排期，只把今天到期的重新抽一遍</span></div>';
    app.innerHTML = h;
    document.getElementById('again').onclick = () => { queue = Q.map(x => x.id); curQ = null; revealed = false; render(); };
    return;
  }
  if(!curQ || !queue.includes(curQ.id)) curQ = byId[queue[0]];
  let h = '<div class="hint" style="margin-bottom:12px;">本轮还剩 ' + queue.length + ' 题' +
          (sessionOk + sessionNg ? ' · 已答 ' + (sessionOk + sessionNg) + ' 题（想起来 ' + sessionOk + ' / 没想起来 ' + sessionNg + '）' : '') +
          '</div>';
  h += cardHTML(curQ, { hint: '先自己回答一遍，再点开答案' });
  app.innerHTML = h;
  bindCard(good => {
    rate(curQ.id, good);
    good ? sessionOk++ : sessionNg++;
    const i = queue.indexOf(curQ.id);
    if(i >= 0) queue.splice(i, 1);
    // 没想起来的题：排期变成"今天"，本轮稍后再落到它 —— 直接压回队尾
    if(!good) queue.push(curQ.id);
    curQ = null; revealed = false;
    renderTabs(); render();
  });
}

/* ---------------- 视图：抽题练习 ---------------- */
function viewRandom(){
  let h = '<div class="chips">' + ['全部'].concat(CATS).map(c =>
      '<button class="chip' + (rndCat === c ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>'
    ).join('') + '</div>';
  if(!curQ){
    h += '<div class="card center"><div class="hint" style="margin-bottom:14px;">随机抽一题，检验自己能不能在没有任何提示的情况下讲出来。</div>' +
         '<button class="btn primary" id="draw">抽一题</button></div>';
    app.innerHTML = h;
    bindChips();
    document.getElementById('draw').onclick = drawQ;
    return;
  }
  h += cardHTML(curQ, { hint: '自评同样会更新排期' });
  h += '<div class="row"><button class="btn sm" id="draw2">换一题</button></div>';
  app.innerHTML = h;
  bindChips();
  document.getElementById('draw2').onclick = drawQ;
  bindCard(good => {
    rate(curQ.id, good);
    renderTabs();
    drawQ();
  });

  function bindChips(){
    app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
      rndCat = c.dataset.c; curQ = null; revealed = false; render();
    });
  }
  function drawQ(){
    const pool = rndCat === '全部' ? Q : Q.filter(x => x.cat === rndCat);
    const cand = pool.filter(x => !curQ || x.id !== curQ.id);
    curQ = cand[Math.floor(Math.random() * cand.length)] || pool[0];
    revealed = false;
    render();
  }
}

/* ---------------- 视图：全部题目 ---------------- */
function viewAll(){
  const groups = {};
  Q.forEach(x => { (groups[x.note] = groups[x.note] || []).push(x); });
  let h = '';
  Object.keys(groups).forEach(note => {
    const list = groups[note];
    const done = list.filter(x => box(x.id) === 4).length;
    h += '<div class="group"><h3 data-g="' + esc(note) + '"><span class="k">' + esc(list[0].title) + '</span>' +
         '<span class="c">' + esc(list[0].cat) + ' · 已掌握 ' + done + '/' + list.length + '</span></h3>';
    list.forEach(x => {
      const b = box(x.id);
      const cls = isNew(x.id) ? 'new' : (b === 4 ? 'ok' : (isDue(x.id) ? 'due' : ''));
      h += '<div class="item" data-id="' + x.id + '"><span class="dotb ' + cls + '"></span><span class="ii">' +
           '<span class="txt">' + esc(x.q) + '</span>' +
           '<span class="body">' + esc(x.a) + '</span>' +
           '<a class="go" href="index.html#' + esc(x.note) + '">看原文 →</a></span></div>';
    });
    h += '</div>';
  });
  app.innerHTML = h;
  app.querySelectorAll('.item').forEach(el => el.onclick = e => {
    if(e.target.tagName === 'A') return;
    el.classList.toggle('open');
  });
}

/* ---------------- 视图：进度统计 ---------------- */
function viewStats(){
  const c = counts();
  const pct = n => c.total ? Math.round(n * 100 / c.total) : 0;
  let h = '<div class="stats">' +
    '<div class="stat"><div class="v">' + c.total + '</div><div class="l">题库总数</div></div>' +
    '<div class="stat"><div class="v">' + c.due + '</div><div class="l">今日待复习</div></div>' +
    '<div class="stat"><div class="v">' + c.mastered + '</div><div class="l">已掌握</div></div>' +
    '<div class="stat"><div class="v">' + (c.total - c.seen) + '</div><div class="l">还没碰过</div></div>' +
    '</div>';

  h += '<div class="blk"><h3>分类进度（已掌握的题数 / 总题数）</h3>';
  CATS.forEach(cat => {
    const list = Q.filter(x => x.cat === cat);
    const m = list.filter(x => box(x.id) === 4).length;
    h += '<div class="line"><span class="nm">' + esc(cat) + '</span><span class="bd"><span class="bar"><i style="width:' +
         (m * 100 / list.length).toFixed(0) + '%"></i></span></span><span class="pc">' + m + '/' + list.length + '</span></div>';
  });
  h += '</div>';

  h += '<div class="blk"><h3>未来 7 天的到期量</h3>';
  for(let i = 0; i < 7; i++){
    const d = soon(i);
    const n = Q.filter(x => { const s = st(x.id); return s && s.d === d; }).length;
    h += '<div class="line"><span class="nm">' + (i === 0 ? '今天' : i === 1 ? '明天' : i + ' 天后') +
         '<br><span style="font-size:11.5px;opacity:.75">' + d.slice(5) + '</span></span>' +
         '<span class="bd"><span class="bar"><i style="width:' + Math.min(n * 100 / Math.max(1, c.total), 100).toFixed(0) + '%"></i></span></span>' +
         '<span class="pc">' + n + ' 题</span></div>';
  }
  h += '</div>';

  h += '<div class="blk"><h3>排期说明</h3><div style="font-size:14px;color:var(--muted);line-height:1.9;">' +
       '自评「想起来了」→ 进下一档：明天 → 3 天后 → 7 天后 → 21 天后（已掌握）。<br>' +
       '自评「没想起来」→ 退一档，最靠前是「今天再来一遍」。<br>' +
       '进度只存在这台设备的浏览器里，清除浏览器数据会丢。' +
       '</div></div>';

  h += '<div class="row between"><button class="btn sm" id="exp">导出进度</button>' +
       '<button class="btn sm" id="rst">重置全部进度</button></div>';
  h += '<div id="expout" style="margin-top:12px"></div>';
  app.innerHTML = h;

  document.getElementById('exp').onclick = () => {
    document.getElementById('expout').innerHTML =
      '<textarea readonly style="width:100%;height:120px;font-family:monospace;font-size:12px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)">' +
      esc(JSON.stringify(DB)) + '</textarea>';
  };
  document.getElementById('rst').onclick = () => {
    if(confirm('确定清空所有自测进度？题不会少，只是排期记录会被删掉。')){
      DB = { v:1, s:{} }; save();
      queue = []; curQ = null; sessionOk = sessionNg = 0;
      renderTabs(); render();
    }
  };
}

/* ---------------- 渲染入口 ---------------- */
function render(){
  if(view === 'review') viewReview();
  else if(view === 'random') viewRandom();
  else if(view === 'all') viewAll();
  else viewStats();
}
function renderAll(){ renderTabs(); render(); }

document.addEventListener('keydown', e => {
  if(!revealed && (e.key === ' ' || e.key === 'Enter') && document.getElementById('rev')){
    e.preventDefault(); revealed = true; render(); return;
  }
  if(revealed && (e.key === '1' || e.key === '2')){
    const el = document.getElementById(e.key === '1' ? 'ng' : 'ok');
    if(el) el.click();
  }
});

renderAll();
</script>
</body>
</html>
